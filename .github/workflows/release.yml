name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            jq \
            meson \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            wayland-protocols
          # Ubuntu 24.04 does not package gtk4-layer-shell; newer releases do.
          sudo apt-get install -y --no-install-recommends libgtk4-layer-shell-dev || true

      - name: Build gtk4-layer-shell if the package is unavailable
        run: |
          if pkg-config --exists gtk4-layer-shell-0; then
            echo "Using gtk4-layer-shell $(pkg-config --modversion gtk4-layer-shell-0)"
            exit 0
          fi

          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          test "$(git rev-parse HEAD)" = "1c963c51514581c41b9bdae08cdf69171265cdda"
          meson setup build --buildtype=release --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dintrospection=false \
            -Dvapi=false
          meson compile -C build
          sudo meson install -C build
          sudo ldconfig
          pkg-config --modversion gtk4-layer-shell-0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "tag=v$tag Cargo.toml=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Package verification
        run: cargo publish --dry-run --locked

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
